<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}网聚 · Tennis Hub{% endblock %}</title>
  <meta name="description" content="网聚 — 网球赛事数据 & 资讯平台，实时比分、动态签表、球员档案、排名榜单。" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23D4E157'/%3E%3Cpath d='M15 40 Q50 25 85 40' stroke='white' stroke-width='3' fill='none'/%3E%3Cpath d='M15 60 Q50 75 85 60' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">
        <span class="logo-ball"></span>
        <span class="logo-text">
          <span>网聚</span>
          <span class="logo-sub">TENNIS HUB</span>
        </span>
      </a>
      <div class="nav-links">
        <a class="nav-link {% if active=='home' %}active{% endif %}" href="/">首页</a>
        <a class="nav-link {% if active=='schedule' %}active{% endif %}" href="/schedule">赛程</a>
        <a class="nav-link {% if active=='draws' %}active{% endif %}" href="/draws">签表</a>
        <a class="nav-link {% if active=='players' %}active{% endif %}" href="/players">球员</a>
        <a class="nav-link {% if active=='rankings' %}active{% endif %}" href="/rankings">排名</a>
        <a class="nav-link {% if active=='news' %}active{% endif %}" href="/news">资讯</a>
      </div>
      <label class="nav-search" aria-label="搜索球员或赛事">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="搜索球员、赛事…" />
      </label>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>© 2025 网聚 · Tennis Hub — 垂直网球数据平台</div>
      <div class="muted">WTA · ATP · 大满贯 · 大师赛 — 数据仅供演示</div>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
